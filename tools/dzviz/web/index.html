<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DZIPC Visualizer</title>
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">d</div>
          <div>
            <h1>DZIPC Visualizer</h1>
            <p id="connectionText">Connecting</p>
          </div>
        </div>

        <div class="sidebar-actions">
          <button id="openAddDisplayBtn" class="primary-action" type="button">+ Add Display</button>
        </div>

        <section class="display-list-panel">
          <div class="section-head">
            <h2>Displays</h2>
            <span id="topicCount">0</span>
          </div>
          <div id="topicList" class="display-list"></div>
        </section>

        <section class="config-panel collapsed">
          <div class="section-head">
            <h2>Config</h2>
            <button class="collapse-toggle icon-button" type="button" aria-label="Expand">+</button>
          </div>
          <div class="config-actions">
            <input id="configPathInput" type="text" placeholder="server config path" />
            <button id="exportConfigBtn" type="button">Export</button>
            <button id="importConfigBtn" type="button">Import</button>
          </div>
        </section>

        <section class="status-panel">
          <div class="section-head">
            <h2>Status</h2>
            <button class="collapse-toggle icon-button" type="button" aria-label="Collapse">−</button>
          </div>
          <div id="eventLog" class="event-log"></div>
        </section>
        <div class="sidebar-resize-handle"></div>
      </aside>

      <main class="viewport-shell">
        <header class="viewport-toolbar">
          <div>
            <h2 id="activeTitle">3D View</h2>
            <p id="activeMeta">Wheel to zoom. Right-drag to move camera. Left-drag to orbit.</p>
          </div>
          <div class="metrics">
            <div><span>Zoom</span><strong id="zoomMetric">18.0</strong></div>
            <div><span>Grid</span><strong>1 m</strong></div>
            <div><span>Displays</span><strong id="displayMetric">0</strong></div>
          </div>
        </header>

        <section class="scene-panel">
          <canvas id="sceneCanvas"></canvas>
          <div class="scene-fps" aria-live="polite">
            <span>FPS</span>
            <strong id="sceneFpsMetric">0.0</strong>
          </div>
          <!--
            【右下角坐标轴蒙版容器 div.scene-overlay】
            - 纯 CSS 定位的 HTML 元素，提供带圆角边框的半透明容器
            - 它本身不渲染 3D 内容，仅作为视觉边框蒙版
            - 3D 坐标轴箭头由 JS renderAxisGizmo() 通过 WebGL scissor/viewport
              渲染在此容器坐标区域内，与 CSS 边框完全对齐
            - 位置/尺寸由 CSS 变量 --reference-axis-inset / --reference-axis-size 控制
            - 子 div 被 CSS clip 隐藏（X/Y/Z 标签仅无障碍语义，实际颜色由 3D 箭头渲染）
          -->
          <div class="scene-overlay">
            <div><strong>X</strong><span>red</span></div>
            <div><strong>Y</strong><span>green</span></div>
            <div><strong>Z</strong><span>blue</span></div>
          </div>

          <div id="imageOverlay" class="image-overlay" hidden>
            <div class="image-overlay-header" id="imageOverlayHeader">
              <span id="imageOverlayTitle">Image</span>
              <button id="imageOverlayClose" class="icon-button" type="button" aria-label="Close">×</button>
            </div>
            <div class="image-overlay-body" id="imageOverlayBody">
              <img id="imageOverlayImg" alt="" />
              <canvas id="imageOverlayCanvas"></canvas>
            </div>
            <div class="image-resize-handle" id="imageResizeHandle"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="displayModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="displayModalTitle">
        <div class="modal-head">
          <h2 id="displayModalTitle">Add Display</h2>
          <button id="closeDisplayModalBtn" class="icon-button" type="button" aria-label="Close">x</button>
        </div>
        <div class="modal-body">
          <label>
            Name / Topic
            <input id="topicInput" type="text" placeholder="robot_state" />
          </label>
          <div class="split">
            <label>
              Display Type
              <select id="typeInput"></select>
            </label>
            <label>
              Message Type
              <select id="messageTypeInput" disabled></select>
            </label>
          </div>
          <label id="urdfPathField" hidden>
            URDF Path
            <input id="urdfPathInput" type="text" placeholder="/path/to/robot.urdf" />
          </label>
          <label id="targetRobotField" hidden>
            Target Robot
            <select id="targetRobotInput"></select>
          </label>
          <div class="split">
            <label>
              Domain
              <input id="domainInput" type="number" min="0" step="1" />
            </label>
            <label>
              Queue
              <input id="queueInput" type="number" min="1" step="1" />
            </label>
          </div>
          <div class="split">
            <label>
              Transport
              <select id="transportInput">
                <option value="socket">socket</option>
                <option value="shm">shm</option>
              </select>
            </label>
            <label>
              Poll ms
              <input id="pollInput" type="number" min="1" step="1" />
            </label>
          </div>
          <label>
            Extra
            <input id="extraInput" type="text" placeholder="InitChannel extra" />
          </label>
        </div>
        <div class="modal-actions">
          <button id="cancelDisplayBtn" type="button">Cancel</button>
          <button id="addTopicBtn" class="primary-action" type="button">Add</button>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
        }
      }
    </script>
    <script>
      (() => {
        const displayModal = document.getElementById("displayModal");
        const topicInput = document.getElementById("topicInput");
        const openBtn = document.getElementById("openAddDisplayBtn");
        const closeBtn = document.getElementById("closeDisplayModalBtn");
        const cancelBtn = document.getElementById("cancelDisplayBtn");
        if (openBtn) {
          openBtn.onclick = () => {
            if (!displayModal) return;
            displayModal.hidden = false;
            topicInput?.focus();
          };
        }
        const hide = () => {
          if (displayModal) displayModal.hidden = true;
        };
        if (closeBtn) closeBtn.onclick = hide;
        if (cancelBtn) cancelBtn.onclick = hide;
      })();
    </script>
    <script type="module" src="/app.js?v=7"></script>
  </body>
</html>
